<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise Day Room Screen</title>
<style>
@font-face{font-family:"Goldtyne Soft Light";src:url(fonts/GoldtyneSoftLight.woff2) format("woff2");font-display:block}
@font-face{font-family:Inter;src:url(fonts/Inter-Variable-latin.woff2) format("woff2");font-weight:100 900;font-display:block}
:root{--ink:#F8F7F4;--muted:#9AA0AC;--raised:#1C1F27;--line:#2A2E36;--accent:#FF7A00;color-scheme:dark}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink)}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(ellipse at 100% 0%,#5A2A06 0%,#2A1405 28%,#000 62%)}
#prog{position:absolute;left:0;top:0;height:4px;width:0;background:var(--line)}
.bar{position:absolute;left:128px;right:128px;top:48px;height:56px;display:flex;justify-content:space-between;align-items:center}
.bar .g{display:flex;align-items:center;gap:44px;font-size:24px;color:var(--muted)}
.bar img{display:block;width:auto}
.card{position:absolute;left:128px;top:170px;width:1664px;height:850px}
.card>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.card>*:nth-child(2){animation-delay:.12s}.card>*:nth-child(3){animation-delay:.24s}
.card.out{animation:fade .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:0}}
h1,h2{font-family:"Goldtyne Soft Light",Georgia,serif;font-weight:400;margin:0;text-wrap:balance}
h1{font-size:72px;line-height:1.3;width:1664px}
h1.big{font-size:104px;line-height:1.2}
.eye{font-size:24px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:20px}
.lede{font-size:40px;line-height:1.35;color:var(--muted);margin:28px 0 0;max-width:1500px}
.people{display:grid;gap:28px;margin-top:44px}
.p{background:var(--raised);border-radius:10px;padding:28px;display:flex;gap:32px;align-items:center}
.p.col{flex-direction:column;align-items:flex-start;gap:20px}
.q{flex:none;background:var(--ink);border-radius:8px;box-sizing:border-box;padding:16px}
.q svg{width:100%;height:100%;display:block}
.r{font-size:24px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.n{font-size:36px;font-weight:700;margin:8px 0;line-height:1.2}
.t{font-size:26px;line-height:1.3;color:var(--muted)}
.s{font-size:22px;color:var(--muted);margin-top:18px}
.agenda{display:grid;grid-template-columns:400px 1fr;font-size:32px;line-height:1.3;border-top:2px solid var(--line);margin-top:36px}
.agenda>div{padding:16px 0;border-bottom:2px solid var(--line)}
.agenda .tm{color:var(--muted)}
.agenda .now{color:var(--accent)}
.startup{display:grid;grid-template-columns:640px 1fr;gap:72px;align-items:center;margin-top:40px}
.tile{height:360px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;padding:48px 64px;box-sizing:border-box}
.tile img{max-width:100%;max-height:260px;object-fit:contain;display:block}
.tile.dark{background:var(--raised)}
.startup h2{font-size:72px;line-height:1.2}
.one{font-size:36px;line-height:1.4;margin:20px 0 0}
.site{font-size:30px;color:var(--muted);margin:16px 0 0}
.hostgrid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:40px}
.hostgrid>div{background:var(--raised);border-radius:8px;padding:48px;display:flex;flex-direction:column;gap:22px}
.hostgrid img{height:56px;width:auto;align-self:flex-start}
.hostgrid .bg{font-family:"Goldtyne Soft Light",Georgia,serif;font-size:52px;line-height:1.3;margin:0}
.hostgrid p{font-size:30px;line-height:1.4;color:var(--muted);margin:0}
.handles{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px;margin-top:44px}
.handles>div{background:var(--raised);border-radius:10px;padding:28px}
.handles .v{font-size:30px;font-weight:600;margin-top:8px;color:var(--ink)}
#bgimg{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;opacity:0;transition:opacity .5s}
#stage.talk #bgimg{opacity:1}
#stage.talk .bar,#stage.talk #prog{visibility:hidden}
.talklogo{position:absolute;left:0;right:0;top:-110px;display:flex;justify-content:center}
#ctl{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;opacity:0;transition:opacity .3s;font:600 14px Inter,sans-serif}
body.show #ctl{opacity:1}
#ctl button{background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
</style></head><body>
<div id="stage">
<img id="bgimg" src="assets/bg_talk_1.jpg" alt="">
<div id="prog"></div>
<div class="bar"><div class="g"><img src="assets/sp_thinkspace.png" alt="Thinkspace" style="height:50px"><img src="assets/sp_trnout.png" alt="trnout." style="height:42px"></div>
<div class="g"><span>Sponsored by</span><img id="barsp" src="assets/sp_jll.png" alt="JLL" style="height:56px"></div></div>
<div id="slot"></div>
</div>
<div id="ctl"><button id="prev">‹</button><button id="reelb">Reel</button><button id="next">›</button><button id="fs">Full screen</button></div>
<script src="qr.js"></script>
<script>
(()=>{
const DAY="2026-10-29",DUR=10000;
// Titles, times, speakers from ops/run_of_show/thu_20261029_run_of_show.md (titles verbatim from Luma, read 2026-10-25). QR = LinkedIn from that table
// bg = talk background, a different color slide of the AI Week deck (Google Slides 1GguMbbp..., pages 1, 3, 4, 5) per session
const SESS=[
 {start:600,end:660,time:"10:00–11:00 AM",bg:1,title:"Fireside Chat with David McJannet, ex-CEO HashiCorp",people:[
  ["david","SPEAKER","David McJannet","Founder & CEO, Dome Systems (ex-CEO HashiCorp)"],
  ["saptak","MODERATOR","Saptak Sen","Founder & CEO, Oikyo.ai"]]},
 {start:660,end:720,time:"11:00 AM–12:00 PM",bg:3,title:"Startup to Enterprise Day Panel: What AI Investments Are Worth Funding?",people:[
  ["arul","PANELIST","Arul Elumalai","President of Gordian, Fortive"],
  ["carmela","PANELIST","Carmela Fortin","Founder, Seattle Startup Coaches"],
  ["whitney","MODERATOR","Whitney McDaniel","Fractional Product Strategist"]]},
 {start:780,end:840,time:"1:00–2:00 PM",bg:4,title:"Startup to Enterprise Day Panel: VC AMA with T.A. McCann & Ryan Else",people:[
  ["ta","PANELIST","T.A. McCann","Pioneer Square Labs"],
  ["ryan","PANELIST","Ryan Else","General Partner, Roadster Capital"],
  ["aniket","MODERATOR","Aniket Naravanekar","Co-founder & CEO, trnout.ai"]]},
 {start:840,end:900,time:"2:00–3:00 PM",bg:5,title:"Startup to Enterprise Day Talk: Enterprise Reasoning",people:[
  ["rohit","PANELIST","Rohit Tatachar","CTO & Co-founder, Glacis"],
  ["vidya","PANELIST","Vidya Subramanian","Co-Founder, EnterpriseReasoning.org"],
  ["ramesh","PANELIST","Ramesh Parameswaran","Co-founder & CEO, LangGrant"],
  ["greg","PANELIST","Greg Coquillo","AI Platform & Infrastructure Product Leader"],
  ["subhadeep","MODERATOR","Subhadeep Chatterjee","Co-author, EnterpriseReasoning.org"]]},
 {start:900,end:1020,time:"3:00–5:00 PM",title:"Startup to Enterprise Day Happy Hour & Startup Showcase",people:[]}
];
// One-liners from the run of show showcase table
const STARTUPS=[
 ["Berrijam","Data-insight products that move organizations from AI ambition to execution.","berrijam.com","berrijam.png"],
 ["Stak","AI financial software for contractors.","stak.cc","stak.png"],
 ["CostClaw","Catches the hidden overcharge on freight invoices before you pay.","costclaw.ai","costclaw.png"],
 ["Convexus","Helps teams move from dialogue to impact.","convexus.us","convexus.png"],
 ["AppTwin","Digital transformation agents for every stage of the journey.","apptwin.ai","apptwin.png"]
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pt=()=>{const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return{date:`${g("year")}-${g("month")}-${g("day")}`,min:+g("hour")*60+ +g("minute")}};
const nowMin=()=>{const n=pt();return n.date===DAY?n.min:(n.date<DAY?-1:9999)};

function person(p,col,qs){return `<div class="p${col?" col":""}"><div class="q" style="width:${qs}px;height:${qs}px">${QR[p[0]]}</div><div><div class="r">${p[1]}</div><div class="n">${esc(p[2])}</div><div class="t">${esc(p[3])}</div></div></div>`}
function sessionCard(s){
 const n=s.people.length,col=n>2,cols=n>2?n:2,qs=n>4?250:n>2?240:300;
 const grid=n?`<div class="people" style="grid-template-columns:repeat(${cols},1fr)">${s.people.map(p=>person(p,col,qs)).join("")}</div>`:"";
 return `<div class="eye">${esc(s.time)}</div><h1>${esc(s.title)}</h1>${grid}`}

// JLL is the Thursday sponsor. One-liner from Kacey Irons (run of show); description from the JLL Luma block (Kacey email 2026-10-28)
const TALK=()=>`<div class="talklogo"><img src="assets/sp_jll.png" alt="JLL" style="height:96px"></div>`;
const sp=()=>`<div class="eye">Thank you to today’s sponsor</div><img src="assets/sp_jll.png" alt="JLL" style="height:150px;margin-top:20px;align-self:flex-start"><p class="lede" style="color:var(--ink)">Raising, hiring, expanding? Let’s talk about the space that grows with you.</p><p class="lede">JLL is a global commercial real estate and investment management firm. Find Kacey Irons (Tenant Representation) at the JLL booth by the entrance, 10 AM to 5 PM.</p>`;
function build(){
 const m=nowMin(),deck=[],reel=[];
 deck.push(()=>`<div class="eye">Today at AI Days</div><h1 class="big">Startup to Enterprise Day</h1><div class="agenda">${SESS.map(s=>`<div class="tm ${m>=s.start&&m<s.end?"now":""}">${esc(s.time)}</div><div>${esc(s.title)}</div>`).join("")}</div>`);
 // Per session: sponsor, speakers + QR, talk background, speakers + QR again
 SESS.filter(s=>s.people.length).forEach(s=>{const c=()=>sessionCard(s),t=()=>TALK();t.bg=s.bg;t.talk=1;if(s.start===660){const ph=()=>`<div style="position:absolute;top:-170px;left:-128px;width:1920px;box-sizing:border-box;padding:60px 80px 170px;background:linear-gradient(rgba(0,0,0,.92) 0%,rgba(0,0,0,.8) 55%,rgba(0,0,0,0));font:88px/1.3 'Goldtyne Soft Light',serif;text-shadow:0 2px 12px rgba(0,0,0,.6);color:#F8F7F4;text-align:center">This could be your office.<br>Ask Natalia for a tour!</div>`;ph.img="assets/venue_photo.webp";ph.talk=1;deck.push(ph)}deck.push(sp,c,t,c)});
 const hh=()=>`<div class="eye">3:00–5:00 PM · downstairs</div><h1 class="big">Happy Hour &amp; Startup Showcase</h1><p class="lede">Meet today’s ${STARTUPS.length} startups, grab a drink, and find the people you came to meet.</p><div style="display:flex;align-items:center;gap:28px;margin-top:56px"><span class="r">VISIT THE JLL BOOTH</span><img src="assets/sp_jll.png" alt="JLL" style="height:72px"></div>`;
 deck.push(sp);deck.push(hh);
 reel.push(sp);
 reel.push(hh);
 const half=Math.ceil(STARTUPS.length/2),st=s=>()=>`<div class="eye">At the Startup Showcase today · 3–5 PM</div><div class="startup"><div class="tile${s[4]?" dark":""}"><img src="assets/${s[3]}" alt="${esc(s[0])} logo"></div><div><h2>${esc(s[0])}</h2><p class="one">${esc(s[1])}</p><p class="site">${esc(s[2])}</p></div></div>`;
 STARTUPS.slice(0,half).forEach(s=>reel.push(st(s)));
 reel.push(()=>`<div class="eye">Your hosts all week</div><div class="hostgrid"><div><img src="assets/sp_thinkspace.png" alt="Thinkspace"><p class="bg">Thinkspace Seattle</p><p>Home of AI Days, all week. 1700 Westlake Ave N #200, on Lake Union.</p></div><div><img src="assets/sp_trnout.png" alt="trnout."><p class="bg">Turn the events you host into pipeline.</p><p>See who’s coming, find the people you most want to meet, and reach them before, during and after the event.</p><p style="color:var(--ink)">trnout.ai</p></div></div>`);
 STARTUPS.slice(half).forEach(s=>reel.push(st(s)));
 return {deck,reel}}

// Deck mode: manual only (arrows / clicker). Reel mode (R): loops the reel cards every 10s until R or Esc.
let C=build(),mode="deck",di=0,ri=0,timer,started=0;
const list=()=>C[mode],idx=()=>mode==="deck"?di:ri;
function render(){const slot=document.getElementById("slot"),olds=[...slot.children];olds.forEach(o=>{if(!o.classList.contains("out")){o.classList.add("out");setTimeout(()=>o.remove(),500)}});
 const el=document.createElement("div");el.className="card";const f=list()[idx()];el.innerHTML=f();if(f.bg||f.img)document.getElementById("bgimg").src=f.img||`assets/bg_talk_${f.bg}.jpg`;document.getElementById("stage").classList.toggle("talk",!!f.talk);slot.appendChild(el);started=performance.now()}
function go(n){clearTimeout(timer);C=build();const L=list().length;n=mode==="deck"?Math.max(0,Math.min(L-1,n)):(n+L)%L;mode==="deck"?di=n:ri=n;render();
 if(mode==="reel")timer=setTimeout(()=>go(ri+1),DUR);document.getElementById("reelb").textContent=mode==="reel"?"Stop reel":"Reel"}
function setMode(m){mode=m;go(idx())}
function tick(){document.getElementById("prog").style.width=mode==="reel"?Math.min(100,(performance.now()-started)/DUR*100)+"%":"0";requestAnimationFrame(tick)}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=document.getElementById("stage");st.style.left=(innerWidth-1920*s)/2+"px";st.style.top=(innerHeight-1080*s)/2+"px";st.style.transform=`scale(${s})`}
addEventListener("resize",fit);fit();
document.getElementById("reelb").onclick=()=>setMode(mode==="reel"?"deck":"reel");
document.getElementById("prev").onclick=()=>go(idx()-1);document.getElementById("next").onclick=()=>go(idx()+1);
const fs=()=>{const d=document,el=d.documentElement,on=d.fullscreenElement||d.webkitFullscreenElement;
 try{const r=on?(d.exitFullscreen||d.webkitExitFullscreen).call(d):(el.requestFullscreen||el.webkitRequestFullscreen).call(el);r?.catch?.(e=>console.warn("fullscreen",e))}catch(e){console.warn("fullscreen",e)}};document.getElementById("fs").onclick=fs;
addEventListener("keydown",e=>{const k=e.key;
 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();go(idx()+1)}
 else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();go(idx()-1)}
 else if(k.toLowerCase()==="r")setMode(mode==="reel"?"deck":"reel");
 else if(k==="Escape"&&mode==="reel")setMode("deck");
 else if(k.toLowerCase()==="f")fs()});
let ht;addEventListener("mousemove",()=>{document.body.classList.add("show");clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove("show"),2500)});
// Keep the display awake (no screensaver or sleep). The browser drops the lock when the tab is hidden, on some
// fullscreen switches and after sleep, so re-request it on every one of those plus any click or key.
let wl=null;
async function wake(){try{if(document.visibilityState==="visible"&&(!wl||wl.released))wl=await navigator.wakeLock.request("screen")}catch(_){}}
["visibilitychange","fullscreenchange","webkitfullscreenchange","click","keydown","pointerdown"].forEach(e=>(e.includes("visib")||e.includes("full")?document:window).addEventListener(e,wake));
setInterval(wake,30000);wake();
(document.fonts?.ready||Promise.resolve()).then(()=>{go(0);requestAnimationFrame(tick)});
})();
</script></body></html>
